# Keep the WebSocket upgrade for the chat, plain keep-alive for everything else
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # TLS ends at the host proxy: an absolute redirect here would point to http://
    absolute_redirect off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Cache static assets aggressively (hashed filenames)
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|ico|svg|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Never cache the HTML entry point so updates propagate immediately.
    # `expires` instead of add_header, which would drop the security headers above.
    location = /index.html {
        expires -1;
    }

    # AI assistant API and chat WebSocket. Resolved per request through Docker's
    # DNS, so the site still starts and serves when the backend is down.
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $assistant_backend http://backend:8787;
        proxy_pass $assistant_backend;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The backend closes idle chats itself; stay above its timeout
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
    }

    # Home: `index` serves /index.html, which try_files below would skip
    location = / {
        index index.html;
    }

    # React Router — every route has a prerendered page (/projects -> projects.html,
    # written by scripts/prerender.mjs). Unknown paths get the app with a real 404.
    location / {
        rewrite ^(.+)/$ $1 permanent;
        expires -1;
        try_files $uri $uri.html =404;
        error_page 404 /index.html;
    }

    # Hide nginx version
    server_tokens off;
}
