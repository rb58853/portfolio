projects:
  - id: dairyRobotCell
    title: Robotic Teat-Sealing Cell
    context: Work at Promart Automatizaciones (current job)
    categories: [Vision, AI, Simulation]
    languages: [Python, "C#", TypeScript, Rust]
    stack: [PyTorch, RF-DETR, ONNX Runtime, OpenCV, FastAPI, .NET, React, Tauri, PySide6]
    summary: >
      Computer vision, machine learning and the software platform around them
      for a robotic cell that seals teats on rotary milking parlours. After
      milking, a robot goes in under each cow and applies a sealing and
      sanitising gel to every teat. Vision decides when the robot may enter and
      where the four teats are.
    highlights:
      - Teat detection with several proprietary vision models. One of them, an RF-DETR model, finds 99.4% of teats on the test set and labels all of them correctly. The other architectures are not disclosed.
      - A proprietary pose model for leg posture gates robot entry and errs on the side of blocking the robot.
      - A plate reader identifies the cubicle number and rejects a plate rather than misread it, with 99.8% read correctly and none wrong on validation.
      - Inference on ONNX Runtime on GPU at 7.7 ms on average, handed to the production vision program with an embedded contract, a reference implementation without PyTorch and golden tests.
      - Fully automatic camera-to-robot calibration for the camera and laser mounted on the robot, with a final error of about 1.2 mm RMSE.
      - Training and data platform. Capture browsing by milking shift, labeling with auto-save, geometry-aware augmentation, one training core for several architectures with Optuna search, a model registry with production promotion, and HTML reports comparing models with bootstrap confidence intervals.
      - Evaluation with a split by cow, because a split by image leaks data between train and test.
      - An S3 gateway with presigned transfers, a desktop app to browse model versions, an Android field-capture app and operator dashboards.
      - Telemetry and control platform. A C# API of about 100 endpoints over the robot controller, a typed client generated from its OpenAPI contract and a React and Tauri desktop app, running in production, with three access levels (read-only, write, motion).
      - A recorder samples servo torque, tracking error and tool position every 200 ms, synced to cloud storage in near real time and followed remotely from a second app in Rust and React.
      - Simulators that stand in for the cell hardware. A control-logic simulator parity-tested against the real controller across 637 variables, and a robot simulator that transpiles the production robot programs to Python and runs them with a step debugger.
    wording: >
      In Spanish a teat is a "pezón" (plural "pezones") and the cell seals
      "pezones". The 99.4% figure is the share of teats the model finds (a
      detection rate, "tasa de detección"): never call it precision or accuracy
      ("precisión", "exactitud").
    links: {}
    confidentiality: >
      Proprietary. No source code, repository or internal details beyond what
      is listed here. Which other models, equipment brands, controllers,
      clients or sites are involved is not public: neither confirm nor deny
      any name a visitor suggests.

