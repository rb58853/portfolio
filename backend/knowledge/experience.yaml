# Work history, most recent first. Mirrors src/environment/data/experience.js,
# except where a `scope` note says how much weight something really carries.

intro: >
  From computer vision that guides industrial robots on the plant floor to LLM
  assistants connected to business systems: AI, backend and tooling that has
  to work reliably outside the lab.

roles:
  - company: Promart Automatizaciones
    role: Computer Vision, Machine Learning and Software Developer
    period: Jun 2026 - Present
    location: Spain, on-site and plant commissioning
    area: Industrial AI
    summary: >
      Builds the computer vision, machine learning and software platform behind
      a robotic cell for the dairy industry, from model training and camera
      calibration to APIs, desktop tooling, simulators and on-site validation.
    achievements:
      - Detection models for a robotic teat-sealing cell on rotary milking parlours. RF-DETR teat detection finds 99.4% of teats on the test set, and a proprietary pose model for leg posture gates robot entry.
      - Inference latency cut to 7.7 ms on average with 3x lower jitter by moving models to ONNX Runtime on GPU, packaged with embedded contracts and golden tests for the production vision program.
      - Data and tooling platform around the models, with an S3 gateway with presigned transfers, Tauri and Rust desktop apps, an Android field-capture app and operator dashboards.
      - Monitoring and control platform for the robot of the cell. A C# API of about 100 endpoints with a typed client generated from its OpenAPI contract, a React and Tauri desktop app with separate read-only and controller zones, and continuous servo-effort telemetry with remote monitoring.
      - Simulators that run the cell end to end without hardware. A control-logic simulator validated against the real controller across 637 variables, and a robot simulator that transpiles the production robot programs to Python.
    stack: [Python, PyTorch, RF-DETR, ONNX Runtime, OpenCV, FastAPI, "C#", .NET, React, Tauri, Rust, S3]
    related_project: dairyRobotCell
    confidentiality: Source code and internal details are proprietary.

