services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUBLIC_URL: ${PUBLIC_URL:-/}
        REACT_APP_GITHUB_TOKEN: ${REACT_APP_GITHUB_TOKEN:-}
    image: portfolio:latest
    container_name: portfolio
    restart: unless-stopped
    # Loopback only: the TLS proxy on the host (nginx, proxying to
    # 127.0.0.1:3000) is the only way in. Published on all interfaces, the
    # port would be a plain-HTTP side door, and Docker bypasses host firewalls.
    ports:
      - "127.0.0.1:${PORT:-3000}:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TZ=UTC
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  # AI assistant API. Not published on the host: nginx in the portfolio
  # container proxies /api/ to it.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: portfolio-backend:latest
    container_name: portfolio-backend
    restart: unless-stopped
    expose:
      - "8787"
    environment:
      - TZ=UTC
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_FALLBACK_MODELS=${LLM_FALLBACK_MODELS:-}
      - GUARD_MODEL=${GUARD_MODEL:-}
      - GUARD_FALLBACK_MODELS=${GUARD_FALLBACK_MODELS:-}
      - TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS:-1}
      - CHAT_BLOCKED_TERMS=${CHAT_BLOCKED_TERMS:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The usage limits live in this process: a memory cap keeps one abusive
    # client from taking the host down, and rotated logs keep the disk safe.
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
